    <div class="info-card glass">
      <h3>🌍 Статус в мире</h3>
      ${isModerator() ? `
        <p style="color:var(--text-dim);">Как модератор, вы не состоите ни в одной стране.</p>
      ` : myCountry ? `
        <p style="margin-bottom:10px;">Страна: <b>${escapeHtml(myCountry.name)}</b> ${myCountry.creatorId === currentUser.id ? '<span class="badge warning">Создатель</span>' : ''}</p>
        <p style="margin-bottom:10px;">Ранг в стране: <span class="badge">${escapeHtml(myRank ? myRank.name : '—')}</span></p>
        <p style="margin-bottom:16px;">Город: ${myCity ? `<b>${escapeHtml(myCity.name)}</b> <span class="badge" style="background:rgba(0,212,255,0.15); color:#7fe4ff;">${escapeHtml(myCityRank ? myCityRank.name : '—')}</span>` : '<span style="color:var(--text-dim);">не состоит</span>'}</p>
        <div style="display:flex; gap:8px;">
          <button class="btn" onclick="navigate('country', {countryId: '${myCountry.id}'})">Открыть страну</button>
          ${myCity ? `<button class="btn" onclick="navigate('city', {countryId: '${myCountry.id}', cityId: '${myCity.id}'})">Открыть город</button>` : ''}
        </div>
      ` : `
        <p style="color:var(--text-dim);">Вы пока не состоите ни в одной стране.</p>
        <button class="btn btn-primary" style="margin-top:12px;" onclick="navigate('countries')">Перейти к странам</button>
      `}
    </div>

    ${!isModerator() && myRequests.length ? `
      <div class="info-card glass">
        <h3>📨 Мои заявки</h3>
        ${myRequests.map(r => {
          const c = CACHE.countries.find(x => x.id === r.countryId);
          return `
            <div class="request-item">
              <div>
                <div style="font-weight:600;">${c ? escapeHtml(c.name) : 'Удалённая страна'}</div>
                <div style="font-size:12px; color:var(--text-dim);">Ожидает рассмотрения</div>
              </div>
              <div class="actions">
                <button class="btn btn-sm btn-danger" onclick="cancelRequest('${r.id}')">Отменить</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}
  `;
}

async function cancelRequest(reqId) {
  await deleteRequestDoc(reqId);
  CACHE.requests = CACHE.requests.filter(r => r.id !== reqId);
  toast('Заявка отменена', 'info');
  renderProfile();
}

// ===== Настройки =====
function renderSettings() {
  document.getElementById('main-content').innerHTML = `
    <div class="page-header">
      <div>
        <h1>⚙️ Настройки</h1>
        <p>Управление вашим аккаунтом</p>
      </div>
    </div>

    <div class="info-card glass">
      <h3>👤 Профиль</h3>
      <div style="display:flex; gap:20px; align-items:center; margin-bottom:20px;">
        ${avatarHtml(currentUser, 80)}
        <div>
          <div style="font-size:18px; font-weight:600; margin-bottom:4px;">${escapeHtml(currentUser.nickname)}</div>
          <div style="color:var(--text-dim); font-size:13px;">${escapeHtml(currentUser.email)}</div>
          ${isModerator() ? '<span class="mod-indicator" style="margin-top:6px;">MOD</span>' : ''}
        </div>
      </div>
      <button class="btn" onclick="openEditProfileModal()">✎ Редактировать профиль</button>
    </div>

    <div class="info-card glass">
      <h3>🔐 Безопасность</h3>
      <p style="margin-bottom:16px;">Измените пароль для защиты аккаунта</p>
      <button class="btn" onclick="openChangePasswordModal()">Сменить пароль</button>
    </div>

    ${isModerator() ? `
      <div class="info-card glass" style="border-color: rgba(255, 77, 109, 0.3); background: linear-gradient(135deg, rgba(255, 77, 109, 0.08), rgba(124, 92, 255, 0.08));">
        <h3>🛡️ Режим модератора</h3>
        <p style="margin-bottom:16px;">Вы в режиме модератора.</p>
      </div>
    ` : ''}

    <div class="info-card glass">
      <h3>🚪 Аккаунт</h3>
      <p style="margin-bottom:16px; color:var(--text-dim);">Выйдите из аккаунта, чтобы войти в другой.</p>
      <button class="btn btn-danger" onclick="confirmLogout()">Выйти из аккаунта</button>
    </div>

    <div class="info-card glass">
      <h3>Удаление аккаунта</h3>
      <p style="margin-bottom:16px; color:var(--text-dim);">Удаление аккаунта — необратимое действие.</p>
      <button class="btn-delete-quiet" onclick="openDeleteAccountConfirm()">Удалить аккаунт</button>
    </div>
  `;
}

function openEditProfileModal() {
  openModal(`
    <div class="modal-header">
      <h2>Редактирование профиля</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="avatar-picker">
      <div class="avatar-preview" id="ep-avatar-preview" style="width:80px;height:80px;font-size:34px;">
        ${currentUser.avatar ? `<img src="${currentUser.avatar}">` : escapeHtml(currentUser.nickname.charAt(0).toUpperCase())}
      </div>
      <div style="flex:1;">
        <label class="label">Аватарка</label>
        <input type="file" id="ep-avatar" accept="image/*" style="font-size:12px; color:var(--text-dim);">
        ${currentUser.avatar ? `<button class="btn btn-sm btn-danger" style="margin-top:6px;" onclick="document.getElementById('ep-avatar-preview').innerHTML='${escapeHtml(currentUser.nickname.charAt(0).toUpperCase())}'; delete document.getElementById('ep-avatar-preview').dataset.avatar;">Удалить</button>` : ''}
      </div>
    </div>
    <div class="form-group">
      <label class="label">Никнейм</label>
      <input type="text" class="input" id="ep-nick" value="${escapeHtml(currentUser.nickname)}" maxlength="20">
      <div class="error-msg" id="err-ep-nick"></div>
    </div>
    <div class="form-group">
      <label class="label">Email</label>
      <input type="email" class="input" id="ep-email" value="${escapeHtml(currentUser.email)}">
      <div class="error-msg" id="err-ep-email"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
    </div>
  `);
  if (currentUser.avatar) document.getElementById('ep-avatar-preview').dataset.avatar = currentUser.avatar;
  document.getElementById('ep-avatar').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const p = document.getElementById('ep-avatar-preview');
      p.innerHTML = `<img src="${ev.target.result}">`;
      p.dataset.avatar = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function saveProfile() {
  const nick = document.getElementById('ep-nick').value.trim();
  const email = document.getElementById('ep-email').value.trim().toLowerCase();
  clearErr('err-ep-nick'); clearErr('err-ep-email');
  if (nick.length < 3) { showErr('err-ep-nick', 'Минимум 3 символа'); return; }
  if (nick.toLowerCase() === 'administrator' && currentUser.nickname.toLowerCase() !== 'administrator') {
    showErr('err-ep-nick', 'Этот никнейм зарезервирован'); return;
  }
  if (!isValidEmail(email)) { showErr('err-ep-email', 'Некорректный email'); return; }
  if (CACHE.users.some(u => u.id !== currentUser.id && u.nickname.toLowerCase() === nick.toLowerCase())) {
    showErr('err-ep-nick', 'Никнейм занят'); return;
  }
  if (CACHE.users.some(u => u.id !== currentUser.id && u.email === email)) {
    showErr('err-ep-email', 'Email уже используется'); return;
  }
  const u = CACHE.users.find(x => x.id === currentUser.id);
  u.nickname = nick; u.email = email;
  const av = document.getElementById('ep-avatar-preview').dataset.avatar;
  if (av) u.avatar = av;
  else if (!document.getElementById('ep-avatar-preview').querySelector('img')) u.avatar = null;
  await saveUser(u);
  currentUser = u;
  closeModal();
  toast('Профиль обновлён', 'success');
  renderSidebarUser();
  renderSettings();
}

function openChangePasswordModal() {
  openModal(`
    <div class="modal-header">
      <h2>Смена пароля</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group">
      <label class="label">Текущий пароль</label>
      <input type="password" class="input" id="cp-old" placeholder="Введите текущий пароль">
      <div class="error-msg" id="err-cp-old"></div>
    </div>
    <div class="form-group">
      <label class="label">Новый пароль</label>
      <input type="password" class="input" id="cp-new" placeholder="Минимум 6 символов">
      <div class="error-msg" id="err-cp-new"></div>
    </div>
    <div class="form-group">
      <label class="label">Повторите новый пароль</label>
      <input type="password" class="input" id="cp-new2" placeholder="Ещё раз">
      <div class="error-msg" id="err-cp-new2"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="savePassword()">Сменить пароль</button>
    </div>
  `);
}
async function savePassword() {
  const oldPass = document.getElementById('cp-old').value;
  const newPass = document.getElementById('cp-new').value;
  const newPass2 = document.getElementById('cp-new2').value;
  clearErr('err-cp-old'); clearErr('err-cp-new'); clearErr('err-cp-new2');

  if (oldPass !== currentUser.password) {
    showErr('err-cp-old', 'Неверный текущий пароль'); return;
  }
  const err = checkPassword(newPass);
  if (err) { showErr('err-cp-new', err); return; }
  if (newPass !== newPass2) { showErr('err-cp-new2', 'Пароли не совпадают'); return; }

  const u = CACHE.users.find(x => x.id === currentUser.id);
  u.password = newPass;
  await saveUser(u);
  currentUser.password = newPass;
  closeModal();
  toast('Пароль изменён', 'success');
}

function confirmLogout() {
  if (!confirm('Выйти из аккаунта?')) return;
  logout();
}

function openDeleteAccountConfirm() {
  openModal(`
    <div class="confirm-delete-modal">
      <div class="modal-header">
        <h2 style="color:var(--danger);">⚠ Удаление аккаунта</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="warning-text">
        Это действие <b>необратимо</b>. Будут удалены:<br>
        • Ваш аккаунт<br>
        • Все созданные вами страны и города<br>
        • Все ваши заявки<br><br>
        Для подтверждения введите ваш <b>никнейм</b>:
        <div class="target-name">${escapeHtml(currentUser.nickname)}</div>
      </div>
      <div class="form-group">
        <input type="text" class="input" id="delete-acc-input" placeholder="Введите никнейм" autocomplete="off">
        <div class="error-msg" id="err-delete-acc"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">Отмена</button>
        <button class="btn btn-danger" id="delete-acc-btn" onclick="confirmDeleteAccount()" disabled style="opacity:0.5;">Удалить аккаунт</button>
      </div>
    </div>
  `);
  const inp = document.getElementById('delete-acc-input');
  const btn = document.getElementById('delete-acc-btn');
  inp.addEventListener('input', () => {
    const match = inp.value.trim() === currentUser.nickname;
    btn.disabled = !match;
    btn.style.opacity = match ? '1' : '0.5';
    inp.classList.toggle('input-mismatch', !match && inp.value.length > 0);
  });
  setTimeout(() => inp.focus(), 100);
}
async function confirmDeleteAccount() {
  const inp = document.getElementById('delete-acc-input');
  if (inp.value.trim() !== currentUser.nickname) {
    showErr('err-delete-acc', 'Никнейм не совпадает'); return;
  }
  const myCountryIds = CACHE.countries.filter(c => c.creatorId === currentUser.id).map(c => c.id);
  for (const cid of myCountryIds) {
    const citiesToDelete = CACHE.cities.filter(ci => ci.countryId === cid);
    for (const ci of citiesToDelete) await deleteCityDoc(ci.id);
    const reqsToDelete = CACHE.requests.filter(r => r.countryId === cid);
    for (const r of reqsToDelete) await deleteRequestDoc(r.id);
    await deleteCountryDoc(cid);
  }
  for (const c of CACHE.countries) {
    const before = c.members.length;
    c.members = c.members.filter(m => m.userId !== currentUser.id);
    if (c.members.length !== before) await saveCountry(c);
  }
  for (const ci of CACHE.cities) {
    if (ci.mayorId === currentUser.id) { ci.mayorId = null; await saveCity(ci); }
  }
  const reqsToDelete = CACHE.requests.filter(r => r.userId === currentUser.id);
  for (const r of reqsToDelete) await deleteRequestDoc(r.id);
  await deleteUserDoc(currentUser.id);
  await loadAllData();
  closeModal();
  toast('Аккаунт удалён', 'success');
  logout();
}

// ===== Старт =====
async function init() {
  document.getElementById('main-content').innerHTML = '<div class="loader">Загрузка данных...</div>';
  await ensureAdmin();
  await loadAllData();

  const savedUserId = localStorage.getItem('mw_currentUserId');
  if (savedUserId) {
    const u = CACHE.users.find(x => x.id === savedUserId);
    if (u) {
      currentUser = u;
      enterApp();
      return;
    } else {
      localStorage.removeItem('mw_currentUserId');
    }
  }
  document.getElementById('auth-screen').style.display = 'flex';
}

init().catch(err => {
  console.error(err);
  document.body.innerHTML = `<div style="padding:40px; color:#ff8fa3; font-family:sans-serif;">
    <h2>Ошибка загрузки</h2>
    <p>${escapeHtml(err.message)}</p>
    <p style="color:#9090b8; margin-top:12px;">Проверь настройки Firestore и правила безопасности.</p>
  </div>`;
});
</script>
